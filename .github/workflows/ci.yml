name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-tests:
    name: Test release publisher on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline release publisher tests
        shell: pwsh
        run: ./tests/Test-Release.ps1

  build:
    name: Build, test and package
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Windows app with a unique version for main pushes
        env:
          AUTOMATIC_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          . .\tools\Build-Version.ps1
          $runNumber = if ($env:AUTOMATIC_RELEASE -eq 'true') { $env:GITHUB_RUN_NUMBER } else { '' }
          $version = Get-NexusMBuildVersion (Join-Path $env:GITHUB_WORKSPACE 'src\AssemblyInfo.cs') $runNumber
          .\build.ps1 -AppVersion $version.AssemblyVersion

      - name: Ensure WebView2 Runtime is installed
        run: |
          $ErrorActionPreference = 'Stop'
          function Test-WebView2 {
            $locations = @(
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
              'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            )
            foreach ($location in $locations) {
              $version = (Get-ItemProperty -LiteralPath $location -Name pv -ErrorAction SilentlyContinue).pv
              if ($version -and [version]$version -gt [version]'0.0.0.0') { return $true }
            }
            return $false
          }
          if (!(Test-WebView2)) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw 'The WebView2 installer does not have a valid Microsoft signature.'
            }
            $process = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw ('WebView2 installation failed: ' + $process.ExitCode) }
            if (!(Test-WebView2)) { throw 'WebView2 Runtime is still unavailable after installation.' }
          }

      - name: Run offline test suites
        run: |
          foreach ($suite in @('Backend', 'HistoryImport', 'Controller', 'QueueBrowser', 'QueueRestart', 'FolderCleanup', 'ModBatch', 'BatchDownload', 'Refresh', 'DownloadUpdates', 'FilePreview', 'FreeDownloadFlow', 'UI', 'Startup', 'Version', 'Package', 'Release')) {
            & powershell -NoProfile -ExecutionPolicy Bypass -File ('.\tests\Test-' + $suite + '.ps1')
            if ($LASTEXITCODE -ne 0) { throw ($suite + ' tests failed.') }
          }

      - name: Package portable download
        id: package
        env:
          NEXUSM_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $package = .\tools\Package-Release.ps1 -Tag $env:NEXUSM_RELEASE_TAG
          $package | Format-List
          ('release_tag=v' + $package.Version) >> $env:GITHUB_OUTPUT

      - name: Upload portable app and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexusm-windows-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload fixture reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-test-reports
          path: |
            artifacts/*-tests.json
            artifacts/ui-tests.png
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish verified app release
    needs: [build, release-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified app and checksum
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nexusm-windows-x64
          path: release

      - name: Publish this build and retain existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: pwsh
        run: |
          .\tools\Publish-Release.ps1 -Repository $env:GITHUB_REPOSITORY -Commit (git rev-parse HEAD) -PackageDirectory release -ExpectedTag $env:RELEASE_TAG
